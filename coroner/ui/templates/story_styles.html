{# Styles of the story, the fool page and the home page links. Colors come only from the variables of base.html. #}
<style>
    .story-positioning { color: var(--secondary-text); margin-bottom: 1.5rem; }
    .story-site-nav { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; margin-bottom: 1rem; }
    .story-site-nav a { display: inline-flex; align-items: center; min-height: 44px; }
    .story-views, .story-steps { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; }
    .story-views a, .story-steps a {
        display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem;
        border: 1px solid var(--border-color); border-radius: 0.25rem;
    }
    .story-views a[aria-current="true"] { border-color: var(--orange-accent); font-weight: 600; }
    .story-progress { color: var(--secondary-text); font-size: 0.875rem; }
    .story-amount { text-align: right; font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace; }
    .story-alert { background-color: var(--panel-bg); border-left: 4px solid var(--invalid-color); padding: 1rem; margin: 1rem 0; }
    .story-action button { min-height: 44px; }
    .story-action label { display: block; margin-bottom: 0.25rem; }
    .story-action input, .story-action select { min-height: 44px; }
    .story-figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1rem 0; }
    .story-figures dt { color: var(--secondary-text); font-size: 0.875rem; }
    .story-figures dd { margin: 0; font-size: 1.5rem; font-weight: 600; }
    .story-example { overflow-x: auto; background-color: var(--panel-bg); padding: 0.75rem; }
    .story-listing { margin: 1rem 0; }
    .story-listing-title { margin: 1rem 0 0.5rem; }
    .story-listing-region { max-width: 100%; overflow-x: auto; border: 1px solid var(--border-color); border-radius: 0.25rem; }
    .story-listing-region pre { margin: 0; }
    .story-listing-error { background-color: var(--panel-bg); border-left: 4px solid var(--invalid-color); padding: 0.75rem; }
    .listing-number { display: inline-block; min-width: 3ch; text-align: right; margin-right: 1ch; color: var(--secondary-text); }
    .listing-executed { border: 1px solid var(--text-color); border-radius: 0.25rem; padding: 0 0.375rem; margin-left: 1ch; font-size: 0.875rem; font-weight: 600; }
    .story-noscript { color: var(--secondary-text); }
    .story-cta {
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0.5rem 1.5rem;
        background-color: var(--orange-accent); color: white; border-radius: 0.25rem; font-size: 1.25rem; font-weight: 600;
    }
    .story-cta:hover { text-decoration: none; opacity: 0.9; }
    .story-cta-links { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem; margin-bottom: 2rem; }
    .story-cta-links a:not(.story-cta) { display: inline-flex; align-items: center; min-height: 44px; font-size: 1.1rem; }
    .fool-form fieldset { border: 1px solid var(--border-color); border-radius: 0.25rem; padding: 1rem; margin: 1rem 0; }
    .fool-form legend { padding: 0 0.5rem; font-weight: 600; }
    .fool-toggle { display: flex; align-items: flex-start; gap: 0.75rem; min-height: 44px; padding: 0.5rem 0; }
    .fool-toggle input[type="checkbox"] { width: 1.5rem; height: 1.5rem; flex: none; margin-top: 0.125rem; }
    .fool-toggle-missing { color: var(--secondary-text); }
    .fool-form button { min-height: 44px; }
    .fool-counter { font-family: Georgia, "Times New Roman", serif; font-size: 1.5rem; font-weight: 600; margin: 1rem 0; }
    .fool-row { background-color: var(--panel-bg); border-radius: 0.5rem; padding: 1rem 1.5rem; margin: 1rem 0; }
    .fool-row h2 { margin-top: 0; }
    .fool-row .verdict-badge { padding: 1rem; margin: 0.5rem 0; }
    .fool-row .verdict-status { font-size: 1.25rem; }
    .fool-row-note { color: var(--secondary-text); }
    #step-heading:focus { outline: 2px solid var(--orange-accent); outline-offset: 4px; }
    .table-scroll { max-width: 100%; overflow-x: auto; }
    .table-scroll table { min-width: 100%; }
    .table-scroll-note { caption-side: bottom; text-align: left; color: var(--secondary-text); font-size: 0.875rem; padding-top: 0.5rem; }
    a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, [tabindex="0"]:focus-visible {
        outline: 2px solid var(--orange-accent); outline-offset: 2px;
    }

    /* Phone width (375 px): one column, 16 px text, 44 px targets, tables and listings scroll inside their box. */
    @media (max-width: 480px) {
        body { padding: 1rem; font-size: 1rem; }
        h1 { font-size: 1.5rem; }
        .theme-toggle { position: static; display: block; min-height: 44px; margin: 0 0 1rem auto; }
        .story-views, .story-steps, .story-site-nav, .story-cta-links { flex-direction: column; align-items: stretch; }
        .story-views a, .story-steps a, .story-site-nav a, .story-cta-links a { width: 100%; justify-content: center; min-height: 44px; }
        .story-progress, .story-figures dt, .listing-number, .listing-executed { font-size: 1rem; }
        .story-figures { grid-template-columns: 1fr; }
        .story-figures dd { font-size: 1.25rem; }
        .story-action button, .fool-form button { width: 100%; min-height: 44px; font-size: 1rem; }
        .story-action input, .story-action select { width: 100%; min-height: 44px; font-size: 1rem; }
        .fool-toggle { min-height: 44px; }
        .fool-row { padding: 1rem; }
        .story-listing-region, .story-example, pre { max-width: 100%; overflow-x: auto; }
    }
</style>

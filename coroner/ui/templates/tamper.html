<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamper Certificate - Coroner</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #e5e5e5;
            --text-secondary: #a3a3a3;
            --border: #2a2a2a;
            --accent: #ff6b35;
            --success: #4ade80;
            --error: #f87171;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem 1rem;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        
        form {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 4px;
            font-size: 1rem;
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        button {
            background: var(--accent);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--accent);
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        #result {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/run/{{ run_id }}" class="back-link">&larr; Back to run</a>
        
        <h1>Tamper Certificate</h1>
        <p class="subtitle">Edit certificate values and verify the result.</p>
        
        <form hx-post="/api/tamper" hx-target="#result" hx-swap="innerHTML">
            <input type="hidden" name="run_id" value="{{ run_id }}">
            
            <div class="form-group">
                <label for="status">Status</label>
                <input type="text" id="status" name="status" value="{{ status }}" required>
            </div>
            
            <div class="form-group">
                <label for="cases_total">Cases Total</label>
                <input type="number" id="cases_total" name="cases_total" value="{{ cases_total }}" required>
            </div>
            
            <div class="form-group">
                <label for="cases_divergent">Cases Divergent</label>
                <input type="number" id="cases_divergent" name="cases_divergent" value="{{ cases_divergent }}" required>
            </div>
            
            <div class="form-group">
                <label for="random_seed">Random Seed</label>
                <input type="number" id="random_seed" name="random_seed" value="{{ random_seed }}" required>
            </div>
            
            <button type="submit">Verify Tampered Certificate</button>
        </form>
        
        <div id="result"></div>
    </div>
</body>
</html>

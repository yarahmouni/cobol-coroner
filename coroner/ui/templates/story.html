{% extends "base.html" %}

{% block title %}The bank failure, step {{ step }} of {{ step_count }} - COBOL Coroner{% endblock %}

{% block head_extra %}
<script src="/static/story.js" defer></script>
<style>
    .story-positioning { color: var(--secondary-text); margin-bottom: 1.5rem; }
    .story-views, .story-steps { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; }
    .story-views a, .story-steps a {
        display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem;
        border: 1px solid var(--border-color); border-radius: 0.25rem;
    }
    .story-views a[aria-current="true"] { border-color: var(--orange-accent); font-weight: 600; }
    .story-progress { color: var(--secondary-text); font-size: 0.875rem; }
    .story-amount { text-align: right; font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace; }
    .story-alert { background-color: var(--panel-bg); border-left: 4px solid var(--invalid-color); padding: 1rem; margin: 1rem 0; }
    .story-action button { min-height: 44px; }
    .story-action label { display: block; margin-bottom: 0.25rem; }
    .story-action input, .story-action select { min-height: 44px; }
    .story-figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1rem 0; }
    .story-figures dt { color: var(--secondary-text); font-size: 0.875rem; }
    .story-figures dd { margin: 0; font-size: 1.5rem; font-weight: 600; }
    .story-example { overflow-x: auto; background-color: var(--panel-bg); padding: 0.75rem; }
    #step-heading:focus { outline: 2px solid var(--orange-accent); outline-offset: 4px; }
    a:focus-visible, button:focus-visible, summary:focus-visible, [tabindex="0"]:focus-visible {
        outline: 2px solid var(--orange-accent); outline-offset: 2px;
    }
</style>
{% endblock %}

{% block content %}
<nav><a href="/">← Back to Index</a></nav>
<header>
    <h1>Try the bank failure</h1>
    <p class="story-positioning">{{ positioning }}</p>
</header>
<main id="story-main">
    <div id="story-content">
        {% include "story_fragment.html" %}
    </div>
</main>
{% endblock %}

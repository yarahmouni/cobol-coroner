name: Test and Security

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t coroner:ci .
      
      - name: Run tests in image
        run: docker run --rm --platform linux/amd64 -e CORONER_NO_SKIP=1 -e PYTHON=python3 coroner:ci python3 -m pytest -q -rs -p no:cacheprovider -m 'not slow and not repo'
      
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      
      - name: Repository checks
        run: CORONER_NO_SKIP=1 python -m pytest -q -rs -p no:cacheprovider -m repo

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    
    steps:
      - name: Checkout code with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

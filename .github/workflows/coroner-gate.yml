name: Coroner Gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gate:
    name: Gate Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t coroner:ci .
      
      - name: Run gate (correct Java)
        run: |
          docker run --platform linux/amd64 --rm \
            -e CORONER_BASE_DIR=/tmp/coroner-runs \
            coroner:ci \
            python3 -m coroner gate
  
  block:
    name: Gate Blocks ZOMBIE
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t coroner:ci .
      
      - name: Generate HALF_EVEN variant and run gate
        run: |
          set +e
          output=$(docker run --platform linux/amd64 --rm \
            -e CORONER_BASE_DIR=/tmp/coroner-runs \
            coroner:ci \
            sh -c "python3 -m coroner.catalog.legacy_variant samples/credit-fees/java/CreditFees.java /tmp/CreditFees.java && \
                   python3 -m coroner gate --java /tmp/CreditFees.java" 2>&1)
          exit_code=$?
          echo "$output"
          
          if [ $exit_code -eq 2 ]; then
            echo "ERROR: Gate returned exit code 2 (ERROR verdict, reference did not run)"
            exit 1
          fi
          
          if [ $exit_code -ne 1 ]; then
            echo "ERROR: Gate did not block ZOMBIE (exit code: $exit_code)"
            exit 1
          fi
          
          if ! echo "$output" | grep -q "ZOMBIE"; then
            echo "ERROR: Output does not contain 'ZOMBIE'"
            exit 1
          fi
          
          echo "SUCCESS: Gate correctly blocked ZOMBIE with exit code 1"

name: Publish Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      
      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.source=https://github.com/yarahmouni/cobol-coroner \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t ghcr.io/yarahmouni/cobol-coroner:sha-${GITHUB_SHA::12} \
            .
      
      - name: Run tests in image
        run: |
          docker run --rm \
            -e CORONER_NO_SKIP=1 \
            -e PYTHON=python3 \
            ghcr.io/yarahmouni/cobol-coroner:sha-${GITHUB_SHA::12} \
            python3 -m pytest -q -p no:cacheprovider -m "not slow and not repo"
      
      - name: Push image
        run: docker push ghcr.io/yarahmouni/cobol-coroner:sha-${GITHUB_SHA::12}
      
      - name: Print digest
        run: |
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/yarahmouni/cobol-coroner:sha-${GITHUB_SHA::12})
          echo "Image: $DIGEST" >> $GITHUB_STEP_SUMMARY

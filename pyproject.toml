[project]
name = "cobol-coroner"
version = "0.1.0"
description = "The independent regression auditor for COBOL-to-Java migrations"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "hypothesis==6.170.14",
]
test = [
    "httpx==0.28.1",
]
screenshots = [
    "playwright==1.64.1",
    "pillow==13.0.0",
]

[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coroner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselected by default)",
    "repo: needs the git checkout; runs on the CI checkout, outside the image",
]
addopts = "-m 'not slow'"
